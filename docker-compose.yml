# ==============================================
# slotm – Docker Compose
# ==============================================

services:
  # ---- Phase 1: Infrastructure ----
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: slotm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: 172.30.0.11
      POSTGRES_PORT: ${POSTGRES_PORT}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      slotm_net:
        ipv4_address: 172.30.0.11
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---- Phase 2: Application ----
  node:
    build:
      context: ./docker/node
      dockerfile: Dockerfile
    container_name: slotm-node
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: ${ENV}
      BUILD_ENV: ${BUILD_ENV}
      APP_HOST: ${APP_HOST}
      APP_PORT: ${APP_PORT}
      NODE_ENV: ${NODE_ENV}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?schema=public
    volumes:
      - ./app:/home/node/app
      - ./app/.env:/home/node/app/.env:ro
      - node_modules:/home/node/app/node_modules
    networks:
      slotm_net:
        ipv4_address: 172.30.0.10
    ports:
      - "4300:4300"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:${APP_PORT}/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- Phase 3: Reverse Proxy ----
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: slotm-nginx
    restart: unless-stopped
    depends_on:
      node:
        condition: service_healthy
    environment:
      APP_PORT: ${APP_PORT}
    networks:
      slotm_net:
        ipv4_address: 172.30.0.12
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null --no-check-certificate https://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- Phase 3: Management UI ----
  pgadmin:
    build:
      context: ./docker/pgadmin
      dockerfile: Dockerfile
    container_name: slotm-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 5050
      SCRIPT_NAME: /pgadmin
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      slotm_net:
        ipv4_address: 172.30.0.13
    ports:
      - "5050:5050"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:5050/pgadmin/misc/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

# ---- Volumes ----
volumes:
  pgdata:
    driver: local
  node_modules:
    driver: local

# ---- Network ----
networks:
  slotm_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1
